[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tagore-llm"
version = "0.1.0"
description = "Auditable Bengali literary continued pretraining with recoverable LoRA training"
requires-python = ">=3.11,<3.13"
dynamic = ["dependencies"]

[project.scripts]
tagore = "tagore_llm.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires network and real model tokenizer", "gpu: requires downloaded weights and CUDA"]
